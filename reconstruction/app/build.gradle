plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
}

android {
    namespace 'dev.local.newsoul'
    compileSdk 35

    defaultConfig {
        applicationId "dev.local.newsoul.public"
        minSdk 26
        targetSdk 35
        versionCode 88
        versionName "1.34.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // LSPosed 模块不需要 activity；dex 保持单文件
    packagingOptions {
        resources.excludes += ['META-INF/**']
    }
}

dependencies {
    // LSPosed API 102 —— 与原模块 module.prop 中的 minApiVersion/targetApiVersion 一致
    compileOnly 'io.github.libxposed:api:100'
}
