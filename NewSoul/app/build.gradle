// New Soul 模块 — 应用模块构建脚本
plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.local.newsoul'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.local.newsoul.public'
        minSdk 26
        targetSdk 35
        versionCode 88
        versionName '1.34.0'
    }

    signingConfigs {
        release {
            storeFile file('../keystore/newsoul.jks')
            storePassword 'newsoul123'
            keyAlias 'newsoul'
            keyPassword 'newsoul123'
            // 与原模块保持一致：使用 v1（JAR）签名
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // libxposed API 102 — 仅编译期需要，框架在运行时由 LSPosed 注入
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}